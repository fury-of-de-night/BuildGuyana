name: Sync shared website standards
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - WEBSITE_BUILD_STANDARDS.md
      - .github/scripts/sync_standards.py
      - .github/standards-sync-state.json
      - .github/workflows/sync-website-standards.yml
permissions:
  contents: read
concurrency:
  group: shared-website-standards
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Synchronize standards across the selected repositories
        env:
          STANDARDS_SYNC_TOKEN: ${{ secrets.STANDARDS_SYNC_TOKEN }}
        run: python3 .github/scripts/sync_standards.py
